[project]
name = "paperpilot"
version = "0.1.0"
description = "arXiv 每日文献情报系统：抓取 → AI 筛选 → AI 结构化总结 → 每日简报（本地 Web）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# mecha v2 接入（src/paperpilot/mecha_adapter/）：本地可编辑框架，非 PyPI 包。
# 装法：pip install -e "D:\code-nosync\mecha[mcp,cockpit]"（见 .qoder/plans 交接文档 Phase 0）。
mecha = [
    "mecha[mcp,cockpit]",
]

[project.scripts]
paperpilot = "paperpilot.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperpilot = ["app/templates/*.html", "data/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer/click 的 Option/Argument 本就要写在参数默认位上（B008 误报）
"src/paperpilot/app/cli.py" = ["B008"]
